name: Draw icons and preview card

# Run by hand (Actions tab > "Draw icons and preview card" > Run workflow) after changing scripts/art.py.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Get the site's fonts (Archivo, Barlow Semi Condensed; SIL Open Font License)
        run: |
          mkdir -p /tmp/fonts && cd /tmp/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          # Archivo is variable (wght, wdth); the brackets in its file names are URL-encoded
          curl -sSfL -o Archivo.ttf "$base/archivo/Archivo%5Bwdth%2Cwght%5D.ttf"
          curl -sSfL -o Archivo-Italic.ttf "$base/archivo/Archivo-Italic%5Bwdth%2Cwght%5D.ttf"
          for f in BarlowSemiCondensed-Regular.ttf BarlowSemiCondensed-Bold.ttf; do
            curl -sSfL -o "$f" "$base/barlowsemicondensed/$f"
          done
      - name: Draw
        run: pip install pillow && python scripts/art.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons og.png
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Draw icons and link preview card"
            git pull --rebase -X theirs && git push
          fi
