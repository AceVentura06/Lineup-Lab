name: Build charts

# Rebuilds the React/Bklit chart bundle (charts/ → assets/charts/) whenever the chart
# source changes on main, and commits the result so GitHub Pages serves it.
on:
  push:
    branches: [main]
    paths: ['charts/**']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-charts
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: charts/package-lock.json
      - name: Build
        working-directory: charts
        run: |
          npm ci
          npm run check
          npm run build
      - name: Commit if the bundle changed
        run: |
          git add assets/charts index.html
          if git diff --cached --quiet; then echo "Bundle unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild chart bundle"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
