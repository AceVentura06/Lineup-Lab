name: Update data

on:
  schedule:
    # Times are UTC. Every 30 minutes, all week (off the hour: GitHub delays and drops top-of-hour runs most).
    - cron: '17,47 * * * *'
    # Sundays from noon to midnight Eastern (16:00–04:00 UTC): two more runs an hour, so every 15 minutes.
    - cron: '2,32 16-23 * * 0'
    - cron: '2,32 0-4 * * 1'
    # Sunday late morning, after teams announce inactives (about 90 minutes before the 1 PM games):
    # 11:45 AM and 12:15 PM Eastern in summer time; the 12:15 PM run also covers winter time (17:15 UTC).
    - cron: '45 15 * * 0'
    - cron: '15 16,17 * * 0'
    # Tuesday 3:30 AM Eastern, when the site moves to the next week (07:35 UTC in summer time, 08:35 in winter).
    - cron: '35 7,8 * * 2'
  workflow_dispatch: {}   # adds a "Run workflow" button for manual refreshes
  push:                   # also runs when the updater itself changes
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # latest main, not the commit that triggered the run
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch fresh data
        run: node scripts/update.mjs
      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs
            git push
          fi
      # after the commit, so a broken model never holds back fresh data; a red run means the accuracy
      # history stopped saving (see scripts/accuracy.test.mjs)
      - name: Check the page model still runs
        run: node --test scripts/accuracy.test.mjs
