name: Update data

on:
  schedule:
    # Times are UTC. Every 3 hours, all week.
    - cron: '17 */3 * * *'
    # Sundays, hourly from noon to midnight Eastern (16:00–04:00 UTC).
    - cron: '47 16-23 * * 0'
    - cron: '47 0-4 * * 1'
    # Tuesday 3:30 AM Eastern, when the site moves to the next week (07:35 UTC in summer time, 08:35 in winter).
    - cron: '35 7,8 * * 2'
  workflow_dispatch: {}   # adds a "Run workflow" button for manual refreshes
  push:                   # also runs when the updater itself changes
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch fresh data
        run: node scripts/update.mjs
      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
