name: Probe endpoints (temporary)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          O='Origin: https://aceventura06.github.io'
          mkdir out
          p(){ n=$1; shift; echo "=== $n" >> out/report.txt;
               curl -s -o out/$n.body -D out/$n.hdr -w 'status=%{http_code} size=%{size_download} time=%{time_total}\n' -H "$O" "$@" >> out/report.txt;
               grep -i '^access-control\|^content-encoding\|^cache-control\|^content-type' out/$n.hdr >> out/report.txt;
               head -c 1500 out/$n.body > out/$n.sample; rm -f out/$n.body; }
          python3 - <<'PY'
          import json,urllib.request,collections
          d=json.load(urllib.request.urlopen('https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries'))
          out=open('out/report.txt','w')
          print('top',list(d.keys()),file=out)
          g=d['injuries'][0];print('group keys',[k for k in g.keys()],file=out)
          e=g['injuries'][0];print('entry keys',list(e.keys()),file=out)
          a=e['athlete'];print('athlete keys',list(a.keys()),file=out)
          print('position',json.dumps(a.get('position'))[:300],file=out)
          print('team',json.dumps(a.get('team'))[:300],file=out)
          for k in e:
            if k!='athlete':print('entry',k,json.dumps(e[k])[:300],file=out)
          c=collections.Counter(x.get('status') for g in d['injuries'] for x in g['injuries']);print('statuses',c.most_common(),file=out)
          c=collections.Counter((x.get('type') or {}).get('name') if isinstance(x.get('type'),dict) else x.get('type') for g in d['injuries'] for x in g['injuries']);print('types',c.most_common(),file=out)
          c=collections.Counter(json.dumps(x.get('details',{}).get('fantasyStatus')) for g in d['injuries'] for x in g['injuries']);print('fantasyStatus',c.most_common(10),file=out)
          print('n',sum(len(g['injuries']) for g in d['injuries']),'groups',len(d['injuries']),file=out)
          old=[x['date'] for g in d['injuries'] for x in g['injuries']];print('dates',min(old),max(old),file=out)
          n=json.load(urllib.request.urlopen('https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=50'))
          a=n['articles'][0];print('article keys',list(a.keys()),file=out);print('links',json.dumps(a.get('links'))[:400],file=out)
          print('cat',json.dumps([c for c in a['categories'] if c.get('type')=='athlete'][:1])[:600],file=out)
          PY
      - name: Push results to probe branch
        run: |
          cd out && git init -q && git checkout -q -b probe && git add . && git -c user.name=probe -c user.email=p@p commit -qm probe
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
