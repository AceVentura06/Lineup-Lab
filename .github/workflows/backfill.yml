name: Backfill accuracy history

on:
  workflow_dispatch:
    inputs:
      from: { description: 'First week', default: '2' }
      to:   { description: 'Last week', default: '5' }
  push:
    branches: [main]
    paths: ['scripts/backfill.mjs']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # latest main, not the commit that triggered the run
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/backfill.mjs ${{ github.event.inputs.from || '2' }} ${{ github.event.inputs.to || '5' }}
      - run: node scripts/update.mjs --force
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Backfill accuracy history" && git pull --rebase -X theirs && git push)
